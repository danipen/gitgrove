name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels the previous, still-running CI for that PR so we
# don't waste runners on stale commits. main builds are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Pin Bun to the version used locally so `bun run lint` / `bun test` behave
# identically on a laptop and in CI — no "works on my machine" surprises.
# Dependency install (cache + retry) lives in .github/actions/install.
env:
  BUN_VERSION: '1.3.14'

jobs:
  # Same command developers run locally: `bun run lint` === `biome check .`.
  # Biome formats and lints with one fast binary; run `bun run lint:fix` to fix.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun run lint

  # Typecheck + unit tests + production build on every supported OS/arch.
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Surface every platform's failures in one run instead of stopping at the
      # first — a Windows-only break shouldn't hide a macOS-only one.
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-latest }
          - { name: Windows x64, os: windows-latest }
          # setup-bun falls back to the x64-baseline build under emulation here,
          # which runs fine; native arm64 kicks in once the action adopts it.
          - { name: Windows arm64, os: windows-11-arm }
          - { name: Linux x64, os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  # Launches the built app with Playwright's Electron driver and asserts the
  # tree + diff actually render. Linux is omitted: headless Electron there needs
  # an xvfb display, which isn't worth the upkeep for a smoke test.
  e2e:
    name: E2E Smoke ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-latest }
          - { name: Windows x64, os: windows-latest }
    steps:
      # Full history so the History tab has commits to render and diff.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Electron's postinstall fetches the binary during `bun install`, but bun
      # doesn't propagate a failed *root* postinstall as a non-zero exit — so a
      # flaky download (or a corrupt cached zip that @electron/get accepts as a
      # cache hit) leaves node_modules/electron with no binary, or a truncated
      # one, while the install step still passes; Playwright then ENOENTs or
      # crashes on launch. This smoke is the only job that launches Electron, so
      # verify the binary is actually *runnable* here — failing loudly instead
      # of mid-test. Re-reading the same cached zip never fixes a corrupt one,
      # so from the second attempt we distrust the cache and force a clean
      # re-download. DEBUG surfaces @electron/get's cache/URL decisions, so a
      # future flake is diagnosable from the run log instead of silent.
      - name: Ensure the Electron binary is installed and runnable
        shell: bash
        env:
          DEBUG: '@electron/get:*'
        run: |
          # Electron >= 42 no longer fetches its binary in its own postinstall,
          # so `bun install` leaves node_modules/electron/dist empty until
          # install.js runs (the eager fetch GitHub Desktop does in post-install).
          # Resolve and launch through Node (execFileSync), not the shell —
          # `require('electron')` throws if path.txt is missing, and spawning by
          # path sidesteps Windows backslash quoting under Git Bash.
          binary_ok() {
            node -e 'require("child_process").execFileSync(require("electron"), ["--version"], { stdio: "ignore" })' 2>/dev/null
          }
          # macOS: a freshly extracted Electron.app can carry a quarantine xattr
          # or a signature Gatekeeper rejects, so the kernel kills the binary on
          # launch ("Killed: 9") even though the downloaded zip's checksum
          # validated. Strip the quarantine and ad-hoc re-sign so it runs. This
          # is the one thing CI must do that GitHub Desktop avoids by never
          # launching Electron at all. No-op off macOS / before the app exists.
          macos_fixup() {
            [ "$(uname)" = "Darwin" ] || return 0
            local app=node_modules/electron/dist/Electron.app
            [ -d "$app" ] || return 0
            xattr -cr "$app" 2>/dev/null || true
            codesign --force --deep --sign - "$app" 2>/dev/null || true
          }
          for attempt in 1 2 3 4; do
            macos_fixup
            if binary_ok; then
              echo "Electron binary present and runnable."
              exit 0
            fi
            echo "::warning::Electron binary missing or broken (attempt ${attempt}/4); reinstalling"
            rm -rf node_modules/electron/dist node_modules/electron/path.txt
            # Attempt 1 trusts the (cheap) cache; from attempt 2 force a genuine
            # re-download. `force_no_cache` alone is NOT honored by @electron/get
            # here (the run log still shows a "Cache hit" on every retry), so
            # also delete its on-disk download cache — otherwise each attempt
            # just re-extracts the same cached zip and all four fail identically.
            # These mirror the cache dirs warmed by .github/actions/install.
            if [ "$attempt" -ge 2 ]; then
              export force_no_cache=true electron_use_remote_checksums=1
              rm -rf ~/.cache/electron ~/Library/Caches/electron ~/AppData/Local/electron/Cache
            fi
            node node_modules/electron/install.js || echo "::warning::install.js exited non-zero"
            sleep $((attempt * 5))
          done
          macos_fixup
          if binary_ok; then
            echo "Electron binary present and runnable."
            exit 0
          fi
          # Still broken — surface WHY (the loop's check is silent), so the real
          # cause lands in the log instead of being guessed at.
          echo "::group::Electron launch diagnostics"
          uname -a || true
          [ "$(uname)" = "Darwin" ] && sw_vers || true
          bin="$(node -e 'process.stdout.write(require("electron"))' 2>&1 || true)"
          echo "resolved electron path: $bin"
          if [ -e "$bin" ]; then ls -la "$bin"; file "$bin"; else echo "binary path missing"; fi
          echo "--- direct launch (stderr shown) ---"
          node -e 'require("child_process").execFileSync(require("electron"), ["--version"], { stdio: "inherit" })' || echo "launch exit: $?"
          echo "::endgroup::"
          echo "::error::Electron binary failed to install after 4 attempts"
          exit 1
      - run: bun run build
      # The smoke opens this repo and asserts the working-tree file tree renders,
      # so it needs at least one change. A fresh checkout is clean, so drop an
      # untracked scratch file to make the Changes view deterministic.
      - name: Seed a working-tree change
        run: echo "e2e smoke marker" > e2e-smoke-scratch.txt
        shell: bash
      - run: bun run e2e
